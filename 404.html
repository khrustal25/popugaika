<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Попугайка — всё о домашних попугаях</title>
  <script>
    /* GitHub Pages: неизвестный путь → index.html с сохранением hash */
    (function () {
      var path = location.pathname || '/'
      var base = path.replace(/\/404\.html$/i, '/')
      if (!/\/$/.test(base)) base = base.replace(/[^/]+$/, '')
      var target = base + 'index.html' + (location.search || '') + (location.hash || '#/')
      location.replace(target)
    })()
  </script>
  <meta http-equiv="refresh" content="0; url=./index.html#/" />
</head>
<body>
  <p>Переход на <a href="./index.html#/">Попугайку</a>…</p>
</body>
</html>
